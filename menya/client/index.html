<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#142B4A" />
    <meta name="description" content="MENYA — AI-powered learning for Rwandan TVET students." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('menya:theme') || 'null')
        var dark = saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.dataset.theme = 'dark'
      } catch (_) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>MENYA — Learn with intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
